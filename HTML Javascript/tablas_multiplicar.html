<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
    <script>
        function genera() {
           const numero = document.getElementById("numero").value;
           if (!numero && numero > 0) {
              alert("Ingresa un numero mayor a 0 para generar la tabla");
              return;
           }
           let resultado = document.getElementById("resultado");
           resultado.innerHTML = "";
           for (let posicion = 0; posicion <= 100; posicion++) {
              let respuesta = numero * posicion;
              resultado.innerHTML += numero + " * " +
                                     posicion + " = " +
                                     respuesta + "<br />";

           }
        }

        
    </script>
</head>

<body>
    <h4>Tablas de multiplicar</h4>
    <div>
        <table>
            <thead>
                <tr>
                    <th colspan="3">
                        Completa cada elemento,
                        para generar su respectiva tabla
                        de multiplicación
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Tabla a generar</td>
                    <td>
                        <input type="number" id="numero" placeholder="6" />
                    </td>
                    <td>
                        <button onclick="genera()">Generar tabla</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <div id="resultado"></div>
    </div>
</body>

</html>
