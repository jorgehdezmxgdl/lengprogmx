<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing car</title>
    <script>
        let posiciones = [0,0,0,0,0];
        const LIMITE   = 900;
        let proceso;

        function inicializa() {
           posiciones = [0,0,0,0,0];
           for (let i=1; i <= 5; i++) {
              let car = document.getElementById("car" + i); 
              car.style.left =  '0px';
           }
        }

        function move_car() {
           for (let i=1; i<=5; i++) {
              let car = document.getElementById("car" + i);
              posiciones[i - 1] += Math.floor(Math.random() * 30); 
              car.style.left =  posiciones[i - 1] + 'px';
              if (posiciones[i - 1] >= LIMITE) {
                  clearInterval(proceso);
                  alert("Auto ganador: " + i);
                  document.getElementById("btnStart").style.display = "block";
                  break;
              }
           }
        }

        function automatic_move() {
           document.getElementById("btnStart").style.display = "none";
           proceso = setInterval( move_car, 150);
        }

        function run_once() {
           inicializa();
           setTimeout( automatic_move, 500);
        }
    </script>
</head>
<body>
     <div style="position: absolute;
             background-color: black;
             left:50px; top:0px; 
             width: 20px; height: 230px;"></div>
     <div style="position: absolute;
             background-color: red;
             left:900px; top:0px; 
             width: 20px; height: 230px;"></div>
    <button id="btnStart" style="position: absolute; 
          left:200px; top:200px;" onclick="run_once()">
          Move car</button>
    <img src="carro.png" id="car1"
         style="width: 40px;height: 40px;
         position: absolute; left:0px; top:0px;" 
         alt="car" />
    <img src="carro.png" id="car2"
         style="width: 40px;height: 40px;
         position: absolute; left:0px; top:45px;" 
         alt="car" />
    <img src="carro.png" id="car3"
         style="width: 40px;height: 40px;
         position: absolute; left:0px; top:90px;" 
         alt="car" />
    <img src="carro.png" id="car4"
         style="width: 40px;height: 40px;
         position: absolute; left:0px; top:135px;" 
         alt="car" />
    <img src="carro.png" id="car5"
         style="width: 40px;height: 40px;
         position: absolute; left:0px; top:180px;" 
         alt="car" />
    
    
</body>
</html>
